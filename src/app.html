<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="MeetFlow - meetings that actually get things done. Schedule meetings, share agendas, join the room, take notes and track action items in one place. Runs entirely in your browser."
		/>
		<meta name="theme-color" content="#4338CA" />
		<script>
			// Apply the saved theme before first paint so there is no light/dark flash.
			try {
				const theme = localStorage.getItem('meetflow:theme') || 'system';
				const dark =
					theme === 'dark' ||
					(theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			} catch (e) {
				// Storage blocked (private mode / embedded webview) - fall back to light.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
